name: MiniGuard CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Biome Lint & Format Check
        run: npx @biomejs/biome check src backend

      - name: Run TypeScript Strict Type Check
        run: npx tsc --noEmit

      - name: Run Vitest Unit & Integration Tests
        run: npx vitest run

      - name: Build Frontend Production Bundle
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '/api/v1' }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  deploy-cloudflare:
    name: Deploy Mini App to Cloudflare Pages
    needs: [test-and-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=miniguard-app

  deploy-vps:
    name: Deploy Backend & Bot Engine to VPS
    needs: [test-and-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.VPS_HOST != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 [CI/CD] Deploying MiniGuard Bot update..."
            mkdir -p /opt/miniguardbot
            cd /opt/miniguardbot
            if [ ! -d .git ]; then
              git clone https://github.com/SeyyedYousef/miniGuardBot.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi
            
            # Run Turnkey Setup Script
            chmod +x setup-vps-miniguard.sh
            ./setup-vps-miniguard.sh
            echo "🎉 [CI/CD] MiniGuard Bot is live and updated!"
