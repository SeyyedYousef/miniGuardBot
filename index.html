<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"/>
    <meta name="theme-color" content="#0b0f17"/>
    <meta name="description" content="MiniGuard (@MiniGuardBot) — پلتفرم مدیریت پیشرفته گروه تلگرام. هر گروه، یک بات مدیریت گروه اختصاصی."/>
    <meta name="robots" content="index, follow"/>
    <meta property="og:title" content="MiniGuard — پلتفرم مدیریت پیشرفته گروه تلگرام"/>
    <meta property="og:description" content="ساخت بات اختصاصی مدیریت گروه تلگرام (۱ بات = ۱ گروه) با ۱۰۰+ قابلیت ضداسپم، فایروال باینری، دستورات چت و پنل شیشه‌ای."/>
    <meta property="og:type" content="website"/>
    <title>MiniGuard — پلتفرم مدیریت پیشرفته گروه تلگرام</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="manifest" href="/manifest.webmanifest"/>

    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 35%, #131c2e 0%, #090d16 70%, #05070c 100%);
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Vazirmatn", "Segoe UI", Roboto, sans-serif;
        opacity: 1;
        transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1), transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        user-select: none;
        -webkit-user-select: none;
      }
      #app-splash.splash-hidden {
        opacity: 0;
        transform: scale(1.03);
        pointer-events: none;
      }
      .splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 28px 24px;
        max-width: 300px;
        width: 100%;
      }
      .splash-logo-wrap {
        position: relative;
        width: 78px;
        height: 78px;
        border-radius: 24px;
        background: linear-gradient(135deg, #0088cc 0%, #0a84ff 50%, #38bdf8 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 36px rgba(10, 132, 255, 0.38), inset 0 1px 1px rgba(255, 255, 255, 0.35);
        margin-bottom: 18px;
        animation: splashPulse 2s ease-in-out infinite;
      }
      .splash-logo-wrap svg {
        width: 42px;
        height: 42px;
        fill: #ffffff;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.2));
      }
      .splash-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #ffffff;
        margin: 0 0 4px 0;
      }
      .splash-badge {
        font-size: 12px;
        font-family: monospace;
        color: #38bdf8;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.25);
        padding: 3px 10px;
        border-radius: 999px;
        margin-bottom: 22px;
        direction: ltr;
      }
      .splash-progress-track {
        width: 190px;
        height: 5px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 11px;
      }
      .splash-progress-fill {
        height: 100%;
        width: 18%;
        background: linear-gradient(90deg, #0a84ff 0%, #38bdf8 100%);
        border-radius: 999px;
        transition: width 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .splash-status {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.65);
        min-height: 18px;
      }
      @keyframes splashPulse {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-3px) scale(1.03); }
      }
    </style>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      window.__SPLASH_START__ = Date.now();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="app-splash" role="status" aria-label="Loading MiniGuard">
      <div class="splash-card">
        <div class="splash-logo-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
          </svg>
        </div>
        <h1 class="splash-title">MiniGuard</h1>
        <div class="splash-badge">@MiniGuardBot • Core v2.6</div>
        <div class="splash-progress-track">
          <div id="splash-progress-bar" class="splash-progress-fill"></div>
        </div>
        <div id="splash-status-text" class="splash-status">در حال بارگذاری هسته امنیتی و رابط کاربری...</div>
      </div>
    </div>
    <div id="root"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
